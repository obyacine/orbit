name: Deploy

# Every push on main: test, build the images on GitHub's machines, publish them on ghcr.io,
# then update the Microclub server. The server never compiles anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deployment at a time; a newer push waits for the running one instead of cutting it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/obyacine

jobs:
  test:
    name: AI agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  build:
    name: Image ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: api, context: apps/api, file: apps/api/Dockerfile.api }
          - { image: web, context: ., file: apps/web/Dockerfile.web }
          - { image: admin, context: ., file: apps/admin/Dockerfile.admin }
          - { image: live, context: ., file: apps/live/Dockerfile.live }
          - { image: ai-service, context: ai-service, file: ai-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/orbit-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/orbit-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to the Microclub server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORBIT_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.ORBIT_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload the compose file and the deploy script
        run: |
          scp deploy/compose.prod.yml "root@${{ vars.ORBIT_SSH_HOST }}:/opt/orbit/compose.yml"
          scp deploy/deploy.sh "root@${{ vars.ORBIT_SSH_HOST }}:/opt/orbit/deploy.sh"
      - name: Pull the new images and restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The workflow's short-lived token reads the private images (sent on stdin, never on a command line);
          # the server keeps no GitHub credential once the job ends.
          printf '%s' "$GH_TOKEN" | ssh "root@${{ vars.ORBIT_SSH_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh "root@${{ vars.ORBIT_SSH_HOST }}" "chmod +x /opt/orbit/deploy.sh && /opt/orbit/deploy.sh '${{ github.sha }}'"
      - name: Forget the registry login
        if: always()
        run: ssh "root@${{ vars.ORBIT_SSH_HOST }}" "docker logout ghcr.io >/dev/null" || true
      - name: The public site answers
        run: |
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.ORBIT_PUBLIC_URL }}/api/instances/" >/dev/null && exit 0
            sleep 3
          done
          exit 1
