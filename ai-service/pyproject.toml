[project]
name = "orbit-ai-service"
version = "0.1.0"
description = "Orbit: AI project-management agent on top of Plane"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "pydantic-settings==2.9.1",
    "google-genai==1.16.1",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = ["pytest==8.3.5", "respx==0.22.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
